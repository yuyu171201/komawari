# 広島大学 令和8（2026）年度 後期（第3ターム・第4ターム）
# 出典: 令和8（2026）年度 学年暦（授業スケジュール）
# https://momiji.hiroshima-u.ac.jp/momiji-top/learning/class-schedule.html
term:
  start: 2026-10-02
  end: 2027-02-08

# ターム別の開講期間。授業に term: 3 のように書くと、その期間だけ開講する
#   試験期間: 第3ターム 11/25（水）〜 12/1（火）、第4ターム 2/2（火）〜 2/8（月）
terms:
  3: {start: 2026-10-02, end: 2026-12-01}
  4: {start: 2026-12-02, end: 2027-02-08}

# コマ番号と時刻の対応表（1=1・2時限, 2=3・4時限, 3=5・6時限, 4=7・8時限, 5=9・10時限）
periods:
  1: {start: "08:45", end: "10:15"}
  2: {start: "10:30", end: "12:00"}
  3: {start: "12:50", end: "14:20"}
  4: {start: "14:35", end: "16:05"}
  5: {start: "16:20", end: "17:50"}

# 通常の時間割（weekday: 0=月 ... 4=金）
# 時刻は period（コマ番号）か start/end の直接指定のどちらか一方
# term を省略した授業は学期全体（セメスター科目）
# ※ 授業名・教室はサンプル。timetable.yaml にコピーして実際の値に差し替えること
classes:
  - {name: Java演習, weekday: 0, period: 2, room: 情報1号館, term: 3}
  - {name: 機械学習, weekday: 2, period: 3, room: A101, term: 4}
  - {name: プログラミング, weekday: 1, period: 4}

# 例外（1行1件。同じ日付に複数行書いてよい）
# 日本の祝日は自動で休講になるので、ここには大学独自のものだけを書く
#   後期の祝日: 10/12 スポーツの日, 11/3 文化の日, 11/23 勤労感謝の日, 1/1 元日, 1/11 成人の日
exceptions:
  # 振替授業日
  - {date: 2026-10-16, as_weekday: 0}   # 金曜 → 月曜授業
  - {date: 2027-01-06, as_weekday: 1}   # 水曜 → 火曜授業
  - {date: 2027-01-14, as_weekday: 0}   # 木曜 → 月曜授業

  # 冬季休業（12/28 〜 1/5。1/1 は祝日）
  - {date: 2026-12-28, off: true}
  - {date: 2026-12-29, off: true}
  - {date: 2026-12-30, off: true}
  - {date: 2026-12-31, off: true}
  - {date: 2027-01-04, off: true}
  - {date: 2027-01-05, off: true}

  # 大学入学共通テスト（1/16・17）の準備のため、1/15（金）は休講の場合あり
  # 休講が決まったら次の行を有効にする
  # - {date: 2027-01-15, off: true}

  # 補講（試験）予備日: 11/28（土）, 12/5（土）, 1/31（日）, 2/9（火）
  # 補講が入ったら extra で追加する。書き方の例:
  # - {date: 2026-11-28, extra: {name: NAME, period: 3, room: ROOM}}   # 補講
  # - {date: 2026-12-09, class: NAME, room: ROOM}                      # 教室変更
  # - {date: 2026-12-09, class: NAME, off: true}                       # その授業だけ休講
