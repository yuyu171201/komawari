[project]
name = "komawari"
version = "0.1.0"
description = "大学の時間割を管理し、週ビューと .ics を提供するアプリ"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "jpholiday>=1.0",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.scripts]
komawari = "komawari.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
